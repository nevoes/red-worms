name: Fetch external assets
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          while read -r dest url; do
            [ -z "$dest" ] && continue
            mkdir -p "$(dirname "$dest")"
            curl -fsSL -A "Mozilla/5.0" -o "$dest" "$url" && echo "ok $dest"
          done < tools/fetch-list.txt
      - run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A archive
          git diff --cached --quiet || git commit -m "Fetch external assets"
          git push
